<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>404 | Doomsday Radio</title>
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#2b2118" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700;800&family=Share+Tech+Mono&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ink: #18120e;
      --oxide: #2b2118;
      --chassis: #3a2c20;
      --paper: #e8e2d6;
      --muted: #c8b9aa;
      --orange: #f36c04;
      --signal: #83ffab;
      --line: rgba(180, 75, 47, 0.46);
      --mono: "Share Tech Mono", monospace;
      --reading: "Space Grotesk", sans-serif;
      --display: "Orbitron", sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      overflow: hidden;
      font-family: var(--reading);
      color: var(--paper);
      background-color: var(--oxide);
      background-image: repeating-linear-gradient(0deg, rgba(255,255,255,0.02) 0 1px, transparent 1px 4px);
    }

    body::before,
    body::after {
      position: fixed;
      content: "";
      pointer-events: none;
    }

    body::before {
      inset: 18px;
      border: 1px solid rgba(180, 75, 47, 0.22);
    }

    body::after {
      inset: 0;
      background: radial-gradient(circle at 50% 45%, transparent 28%, rgba(14, 11, 9, 0.58) 100%);
    }

    main {
      position: relative;
      z-index: 1;
      width: min(740px, 100%);
      padding: clamp(24px, 5vw, 48px);
      border: 1px solid var(--line);
      border-radius: 8px;
      background: linear-gradient(180deg, var(--chassis), #221a14);
      box-shadow: 0 4px 16px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.12), inset 0 -12px 24px rgba(0,0,0,.18);
    }

    main::before,
    main::after {
      position: absolute;
      width: 8px;
      height: 8px;
      border: 1px solid var(--orange);
      content: "";
    }

    main::before { top: 10px; left: 10px; border-right: 0; border-bottom: 0; }
    main::after { right: 10px; bottom: 10px; border-left: 0; border-top: 0; }

    .eyebrow {
      margin: 0 0 12px;
      color: var(--signal);
      font: .75rem/1.2 var(--mono);
      letter-spacing: .14em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0 0 14px;
      font-family: var(--display);
      font-size: clamp(1.6rem, 5vw, 2.65rem);
      letter-spacing: .04em;
      line-height: 1.12;
      text-transform: uppercase;
    }

    p {
      max-width: 56ch;
      margin: 0 0 24px;
      line-height: 1.55;
      color: var(--muted);
    }

    a {
      display: inline-flex;
      align-items: center;
      min-height: 42px;
      text-decoration: none;
      color: var(--ink);
      background: var(--orange);
      border: 1px solid var(--orange);
      border-radius: 4px;
      padding: 10px 14px;
      font: .78rem/1 var(--mono);
      font-weight: 700;
      letter-spacing: .08em;
      text-transform: uppercase;
      box-shadow: inset 0 1px 0 rgba(255,255,255,.22);
    }

    a:hover {
      background: var(--signal);
      border-color: var(--signal);
    }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">Transmission fault // node unavailable</p>
    <h1>404: Signal verloren</h1>
    <p>Diese Frequenz existiert nicht oder wurde verlegt. Zurück zur Hauptseite von Doomsday Radio.</p>
    <a href="/">Zur Startseite</a>
  </main>
  <script defer src="/analytics-loader.js"></script>
</body>
</html>
