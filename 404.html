<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>404 | Doomsday Radio</title>
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#1b1613" />
  <style>
    :root {
      --bg: #2b2118;
      --bg2: #5a493c;
      --text: #e8e2d6;
      --muted: #c8b9aa;
      --accent: #f36c04;
      --line: rgba(232, 226, 214, 0.2);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: "Segoe UI", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 16% 12%, rgba(255, 157, 47, 0.14), transparent 20%),
        radial-gradient(circle at 82% 14%, rgba(255, 209, 102, 0.08), transparent 18%),
        linear-gradient(165deg, var(--bg2), var(--bg) 72%);
    }

    main {
      width: min(640px, 100%);
      padding: 28px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: rgba(20, 17, 15, 0.74);
      box-shadow: 0 14px 36px rgba(0, 0, 0, 0.35);
    }

    h1 {
      margin: 0 0 10px;
      font-size: clamp(1.8rem, 5vw, 2.6rem);
      letter-spacing: 0.03em;
    }

    p {
      margin: 0 0 18px;
      line-height: 1.55;
      color: var(--muted);
    }

    a {
      display: inline-block;
      text-decoration: none;
      color: #111;
      background: var(--accent);
      padding: 10px 14px;
      border-radius: 10px;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <main>
    <h1>404: Signal verloren</h1>
    <p>Diese Frequenz existiert nicht oder wurde verlegt. Zurück zur Hauptseite von Doomsday Radio.</p>
    <a href="/">Zur Startseite</a>
  </main>
  <script defer src="/analytics-loader.js"></script>
</body>
</html>
