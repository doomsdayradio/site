<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>404 | Doomsday Radio</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#3b3128">
  <link rel="stylesheet" href="/design-system.css">
</head>
<body>
  <canvas id="dust" aria-hidden="true"></canvas>
  <div class="scanlines" aria-hidden="true"></div>
  <div class="vignette" aria-hidden="true"></div>
  <div class="rust-stain a" aria-hidden="true"></div>
  <div class="rust-stain b" aria-hidden="true"></div>
  <div class="rust-stain c" aria-hidden="true"></div>
  <div class="glitch-line" aria-hidden="true"></div>
  <div class="glitch-line" aria-hidden="true"></div>
  <div class="corner tl" aria-hidden="true"></div>
  <div class="corner tr" aria-hidden="true"></div>
  <div class="corner bl" aria-hidden="true"></div>
  <div class="corner br" aria-hidden="true"></div>
  <main class="specimen" aria-labelledby="error-title">
    <header class="specimen-header">
      <div class="wordmark">
        <span class="wordmark-mark"><img src="/ddd_radio_logo.png" alt="Doomsday Radio Logo"></span>
        <div class="wordmark-text">
          <span class="ddd-label">System // Route Error</span>
          <strong>Doomsday Radio</strong>
        </div>
      </div>
      <div class="system-status-pill"><span>NODE: UNAVAILABLE</span></div>
    </header>
    <article class="module-card">
      <header class="module-card-header">
        <span class="header-left"><span class="status-indicator-dot" aria-hidden="true"></span><span class="sample-label">Transmission fault // node unavailable</span></span>
        <span class="module-card-id">404</span>
      </header>
      <div class="module-card-body">
        <div class="module-copy">
          <h1 id="error-title">404: Signal verloren</h1>
          <p>Diese Frequenz existiert nicht oder wurde verlegt. Zurück zur Hauptseite von Doomsday Radio.</p>
          <div class="module-actions"><a class="hardware-button ddd-focus" href="/">Zur Startseite</a></div>
        </div>
      </div>
    </article>
  </main>
  <script defer src="/analytics-loader.js"></script>
</body>
</html>
