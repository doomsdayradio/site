<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Doomsday Radio</title>
  <meta name="description" content="Doomsday Radio ist eine postapokalyptische KI-Radio-Welt mit Teaser, Archiv, Lore und interaktiver Karte.">
  <link rel="canonical" href="https://doomsday.radio/">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Doomsday Radio">
  <meta property="og:locale" content="de_DE">
  <meta property="og:title" content="Doomsday Radio">
  <meta property="og:description" content="Postapokalyptische KI-Radio-Welt mit schwarzem Humor, Brutalitaet und Absurditaet.">
  <meta property="og:url" content="https://doomsday.radio/">
  <meta property="og:image" content="https://doomsday.radio/ddd_radio_logo.png">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Doomsday Radio">
  <meta name="twitter:description" content="Postapokalyptische KI-Radio-Welt mit Teaser, Archiv, Lore und Karte.">
  <meta name="twitter:image" content="https://doomsday.radio/ddd_radio_logo.png">
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="manifest" href="/site.webmanifest">
  <link rel="stylesheet" href="/design-system.css">
  <link rel="stylesheet" href="./index.css?v=20260915-map-bg1">
</head>
<body>

  <div id="canvas-container" aria-hidden="true"></div>

  <div id="fluid-background" aria-hidden="true"><canvas></canvas></div>
  <canvas id="dust"></canvas>
  <div class="noise"></div>
  <div class="scanlines"></div>
  <div class="vignette"></div>

  <div class="rust-stain a"></div>
  <div class="rust-stain b"></div>
  <div class="rust-stain c"></div>

  <div class="glitch-line"></div>
  <div class="glitch-line"></div>
  <div class="glitch-line"></div>

  <div class="corner tl"></div>
  <div class="corner tr"></div>
  <div class="corner bl"></div>
  <div class="corner br"></div>

  <div id="bass-debug" class="bass-debug" aria-hidden="true">
    <span class="bass-debug-label">BASS</span>
    <output id="bass-debug-readout">00%</output>
    <span class="bass-debug-track"><span id="bass-debug-fill"></span></span>
    <span class="bass-debug-label">HARD / GLITCH</span>
    <output id="bass-debug-hard-readout">00% / 88%</output>
  </div>

  <main class="center specimen">
    <div class="dial">
      <div class="dial-ring"></div>
      <div class="dial-ring"></div>
      <div class="dial-ring"></div>
      <div class="waves">
        <div class="wave"></div>
        <div class="wave"></div>
        <div class="wave"></div>
        <div class="wave"></div>
      </div>
      <div class="freq-ticks" id="freqTicks"></div>
    </div>

    <header class="hero-mark specimen-header wordmark">
      <h1 class="sr-only">Doomsday Radio</h1>
      <div class="hero-logo-stage">
        <img class="hero-logo" src="./ddd_radio_logo.png" alt="Doomsday Radio">
      </div>
      <section class="radio-player module-card" aria-label="Doomsday Radio Livestream">
        <audio id="radio-stream" preload="none" data-src="https://stream.doomsday.radio/live"></audio>
        <div id="equalizer" class="equalizer" aria-hidden="true"></div>
        <div class="player-controls">
          <div class="stream-action">
            <button id="stream-toggle" class="stream-toggle transport-btn ddd-focus" type="button" aria-label="Livestream abspielen" aria-pressed="false" title="Livestream abspielen">
              <span class="stream-icon transport-icon" aria-hidden="true">▶</span>
            </button>
            <div class="stream-copy" aria-live="polite">
              <strong>LIVE TRANSMISSION</strong>
              <span id="stream-status">SIGNAL BEREIT</span>
            </div>
          </div>
          <div class="control-group volume-control">
            <span class="sample-label">LAUTSTÄRKEREGLER</span>
            <label class="range-wrap">
              <span class="sr-only">Lautstärke</span>
              <input id="stream-volume" type="range" min="0" max="1" step="0.05" value="0.8">
            </label>
          </div>
        </div>
      </section>
      <p id="station-slogan" class="freq" aria-live="polite">Eine Welt, die sich über Radio vermittelt, ordnet und erinnert.</p>
      <div class="signal-dot"></div>
    </header>
  </main>

  <nav class="action-bar section-nav" aria-label="Doomsday Radio Bereiche">
    <button id="section-menu-toggle" class="section-menu-toggle ddd-focus" type="button" aria-expanded="false" aria-controls="section-menu" aria-label="Menü öffnen" title="Menü öffnen">
      <span aria-hidden="true"></span><span aria-hidden="true"></span><span aria-hidden="true"></span>
    </button>
    <div id="section-menu" class="section-menu">
      <a class="ddd-focus" href="/lore/">Lore</a>
      <a class="ddd-focus" href="/archiv/">Archiv</a>
      <a class="ddd-focus" href="/signaldecoder/">Spiele</a>
      <a class="ddd-focus" href="/story/map/">Karte</a>
      <button id="toggle-paper" class="ddd-focus" type="button" aria-pressed="false" data-start-visible="false">Impressum</button>
    </div>
  </nav>

  <div class="status">
    <div class="led-meter-wrapper" role="meter" aria-label="Signalpegel" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
      <div class="meter-meta"><span class="sample-label">SIGNAL</span><output id="signal-led-readout" class="meter-readout">00%</output></div>
      <div id="signal-led-row" class="led-row" aria-hidden="true"></div>
    </div>
    <div id="weather-status" class="weather-status" role="status" aria-live="polite">
      <span class="weather-icon" aria-hidden="true">☁</span>
      <span class="weather-copy"><span class="weather-location">STANDORT</span><span id="weather-summary">MAP SERVICE OFFLINE</span></span>
    </div>
    <span id="clock">00:00:00</span>
    <span>FREQ:107.END &nbsp; PWR:LOW</span>
  </div>

  <script src="./story/map/libs/three.min.js"></script>
  <script src="./script.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/meyda@5.6.3/dist/web/meyda.min.js"></script>
  <script src="./fx-config.js?v=8"></script>
  <script src="./index-ui.js?v=20260917-sync1"></script>
  <script type="module" src="./fluid-background.js?v=20260917-dominance1"></script>
  <script defer src="/analytics-loader.js"></script>
</body>
</html>
