name: Deploy site to Bunny CDN

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-site-bunny
  cancel-in-progress: true

permissions:
  contents: read

env:
  BUNNY_STORAGE_ENDPOINT: ${{ vars.BUNNY_STORAGE_ENDPOINT }}
  BUNNY_STORAGE_ZONE: ${{ vars.BUNNY_STORAGE_ZONE }}
  BUNNY_STORAGE_PASSWORD: ${{ secrets.BUNNY_STORAGE_PASSWORD }}

jobs:
  notify-start:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Notify workflow start
        continue-on-error: true
        shell: bash
        env:
          NTFY_DOOMSDAY_BUILDS: ${{ secrets.NTFY_DOOMSDAY_BUILDS }}
        run: |
          set -euo pipefail
          if [ -z "${NTFY_DOOMSDAY_BUILDS:-}" ]; then
            echo "NTFY_DOOMSDAY_BUILDS fehlt; Build-Benachrichtigung übersprungen."
            exit 0
          fi
          repo="${GITHUB_REPOSITORY#*/}"
          timestamp="$(TZ=Europe/Berlin date '+%Y-%m-%d %H:%M:%S %Z')"
          message="${repo} | ${timestamp} | START | ${GITHUB_WORKFLOW} | Event: ${GITHUB_EVENT_NAME} | Branch: ${GITHUB_REF_NAME} | Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          curl --fail --silent --show-error --output /dev/null \
            --connect-timeout 5 --max-time 20 \
            -H "Authorization: Bearer ${NTFY_DOOMSDAY_BUILDS}" \
            -H "Title: ${repo} | START | ${GITHUB_WORKFLOW}" \
            --data-binary "$message" \
            https://ntfy.bot.omg.lol/doomsday-github-action

  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Checkout archive
        uses: actions/checkout@v5
        with:
          repository: doomsdayradio/archiv
          ref: main
          path: .archive-source

      - name: Stage archive route
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p site/archiv
          rsync -av --exclude='.git*' .archive-source/ site/archiv/

      - name: Download public design stylesheet
        run: |
          if ! curl --fail --location --retry 3 \
            https://doomsday.radio/design-system/latest/design-system.css \
            --output /tmp/design-system.css; then
            echo "CDN snapshot is not published yet; using the committed snapshot."
          else
            cp /tmp/design-system.css site/design-system.css
          fi

      - name: Validate public design contract
        run: python3 tools/validate_public_design.py

      - name: Validate required Bunny configuration
        shell: bash
        run: |
          set -euo pipefail
          for name in BUNNY_STORAGE_ENDPOINT BUNNY_STORAGE_ZONE BUNNY_STORAGE_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "Missing GitHub variable/secret: ${name}" >&2
              exit 1
            fi
          done

      - name: Upload site files flat through Bunny S3
        env:
          AWS_ACCESS_KEY_ID: ${{ vars.BUNNY_STORAGE_ZONE }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.BUNNY_STORAGE_PASSWORD }}
          AWS_DEFAULT_REGION: de
        shell: bash
        run: |
          set -euo pipefail
          # `cp` without size/time comparison overwrites every existing object.
          aws s3 cp site/ "s3://${BUNNY_STORAGE_ZONE}/" \
            --recursive \
            --endpoint-url "${BUNNY_STORAGE_ENDPOINT}"

      - name: Purge Bunny CDN cache
        env:
          BUNNY_PULL_ZONE_ID: ${{ vars.BUNNY_PULL_ZONE_ID }}
          BUNNY_API_KEY: ${{ secrets.BUNNY_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${BUNNY_PULL_ZONE_ID:-}" ] || [ -z "${BUNNY_API_KEY:-}" ]; then
            echo "BUNNY_PULL_ZONE_ID/BUNNY_API_KEY are not configured; skipping CDN purge."
            exit 0
          fi
          curl --fail --silent --show-error --request POST \
            --header "AccessKey: ${BUNNY_API_KEY}" \
            "https://api.bunny.net/pullzone/${BUNNY_PULL_ZONE_ID}/purgeCache"

      - name: Publish deployment summary
        run: |
          echo "Bunny path: / (bucket root)"
          echo "Bunny endpoint: ${BUNNY_STORAGE_ENDPOINT}"
          echo "Commit: ${GITHUB_SHA}"

  notify-finish:
    if: ${{ always() }}
    needs:
      - notify-start
      - deploy
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Notify workflow result
        continue-on-error: true
        shell: bash
        env:
          NTFY_DOOMSDAY_BUILDS: ${{ secrets.NTFY_DOOMSDAY_BUILDS }}
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          if [ -z "${NTFY_DOOMSDAY_BUILDS:-}" ]; then
            echo "NTFY_DOOMSDAY_BUILDS fehlt; Build-Benachrichtigung übersprungen."
            exit 0
          fi
          repo="${GITHUB_REPOSITORY#*/}"
          timestamp="$(TZ=Europe/Berlin date '+%Y-%m-%d %H:%M:%S %Z')"
          result="$(jq -r '[to_entries[] | select(.key != "notify-start") | .value.result] | if index("failure") then "failure" elif index("cancelled") then "cancelled" elif index("success") then "success" else "skipped" end' <<< "$NEEDS_JSON")"
          details="$(jq -r '[to_entries[] | select(.key != "notify-start") | "\(.key): \(.value.result)"] | join(", ")' <<< "$NEEDS_JSON")"
          message="${repo} | ${timestamp} | ENDE: ${result} | ${GITHUB_WORKFLOW} | Jobs: ${details} | Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          curl --fail --silent --show-error --output /dev/null \
            --connect-timeout 5 --max-time 20 \
            -H "Authorization: Bearer ${NTFY_DOOMSDAY_BUILDS}" \
            -H "Title: ${repo} | ENDE: ${result} | ${GITHUB_WORKFLOW}" \
            --data-binary "$message" \
            https://ntfy.bot.omg.lol/doomsday-github-action
