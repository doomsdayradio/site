name: Deploy site to Bunny CDN

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-site-bunny
  cancel-in-progress: true

permissions:
  contents: read

env:
  BUNNY_STORAGE_ENDPOINT: ${{ vars.BUNNY_STORAGE_ENDPOINT }}
  BUNNY_STORAGE_ZONE: ${{ vars.BUNNY_STORAGE_ZONE }}
  BUNNY_STORAGE_PASSWORD: ${{ secrets.BUNNY_STORAGE_PASSWORD }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Checkout archive
        uses: actions/checkout@v5
        with:
          repository: doomsdayradio/archiv
          ref: main
          path: .archive-source

      - name: Stage archive route
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p archiv
          cp -R .archive-source/index.html .archive-source/script.js \
            .archive-source/style.css .archive-source/books.json \
            .archive-source/audio .archive-source/books .archive-source/vendor archiv/
          rm -rf archiv/.git

      - name: Download public design stylesheet
        run: |
          if ! curl --fail --location --retry 3 \
            https://doomsday.radio/design-system/latest/design-system.css \
            --output /tmp/design-system.css; then
            echo "CDN snapshot is not published yet; using the committed snapshot."
          else
            cp /tmp/design-system.css design-system.css
          fi

      - name: Validate public design contract
        run: python3 tools/validate_public_design.py

      - name: Validate required Bunny configuration
        shell: bash
        run: |
          set -euo pipefail
          for name in BUNNY_STORAGE_ENDPOINT BUNNY_STORAGE_ZONE BUNNY_STORAGE_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "Missing GitHub variable/secret: ${name}" >&2
              exit 1
            fi
          done

      - name: Upload static files through Bunny S3
        env:
          AWS_ACCESS_KEY_ID: ${{ vars.BUNNY_STORAGE_ZONE }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.BUNNY_STORAGE_PASSWORD }}
          AWS_DEFAULT_REGION: de
        shell: bash
        run: |
          set -euo pipefail
          aws s3 sync . "s3://${BUNNY_STORAGE_ZONE}/" \
            --endpoint-url "${BUNNY_STORAGE_ENDPOINT}" \
            --exclude '.git/*' \
            --exclude '.github/*' \
            --exclude 'design-system/*'

      - name: Publish deployment summary
        run: |
          echo "Bunny path: / (bucket root)"
          echo "Bunny endpoint: ${BUNNY_STORAGE_ENDPOINT}"
          echo "Commit: ${GITHUB_SHA}"
